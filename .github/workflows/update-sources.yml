name: Update Ask BIONEXT sources

on:
  workflow_dispatch:

  schedule:
    - cron: "15 5 * * *"

permissions:
  contents: write

jobs:
  update-sources:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Rebuild source database
        run: python source_builder.py

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet sources.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated sources
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "Ask BIONEXT updater"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sources.json
          git commit -m "Daily update of BIONEXT source database"
          git push